packages:
  - apps/*
  - packages/*

# Shared dependency versions (`"dep": "catalog:"` in package.json files)
catalog:
  typescript: ^6.0.3
  vitest: ^4.1.8
  '@vitest/coverage-v8': ^4.1.8
  '@types/node': ^22

# pnpm ≥10 blocks lifecycle scripts of deps unless allow-listed
allowBuilds:
  workerd: true
  esbuild: true
  # pulled in by @better-auth/cli; never run on Workers, no need to build
  '@prisma/client': false
  better-sqlite3: false

# Windows MAX_PATH: @better-auth/drizzle-adapter has a ~200-char peer suffix, which pushes the
# virtual-store path past 260 chars and leaves dangling junctions. Hash long peer suffixes.
peersSuffixMaxLength: 40
